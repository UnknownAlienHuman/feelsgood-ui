name: Harden minimap transactional drag

on:
  push:
    branches:
      - codex/minimap-transactional-drag
    paths:
      - '.github/workflows/harden-minimap-transactional-drag.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply minimap ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_minimap_transactional_drag.py
          git diff --check

      - name: Audit minimap ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('core/MinimapIcon.lua').read_text()
          db = Path('core/DB.lua').read_text()
          settings = Path('core/Settings.lua').read_text()
          check = Path('check_lua.js').read_text()

          assert 'local runtimeCfg = {}' in source
          assert 'LDBIcon:Register(addonName, obj, runtimeCfg)' in source
          assert 'LDBIcon:Register(addonName, obj, cfg)' not in source
          assert 'LDBIcon:Refresh(addonName, cfg)' not in source
          assert 'CommitDraggedPosition' in source
          assert 'EnsureDragHooks' in source
          assert 'radius = 80' not in db
          assert 'mm.radius = ValidateNumber' not in settings
          assert 'live minimap profile registration' in check
          print('Minimap ownership audit passed.')
          PY

      - name: Run Lua drag harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_minimap_transactional_drag.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-minimap-transactional-drag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make minimap drag transactional" -m "Pass a detached runtime proxy to LibDBIcon, keep per-frame drag updates out of SavedVariables, commit one normalized position on drag stop, restore persisted state on failure or detach, and remove the dead per-addon radius field. Release FeelsGoodUI 0.0.54."
          git push origin HEAD:codex/minimap-transactional-drag
