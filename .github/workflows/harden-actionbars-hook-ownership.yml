name: Harden ActionBars hook ownership

on:
  push:
    branches:
      - codex/actionbars-hook-ownership

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply ActionBars hook transform
        shell: bash
        run: |
          set -euo pipefail
          python .codex/fix_actionbars_transform.py
          python .codex/harden_actionbars_hook_ownership.py
          git diff --check

      - name: Audit ActionBars hook ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          state = Path('modules/ActionBarsState.lua').read_text()
          runtime = Path('modules/ActionBarsRuntime.lua').read_text()
          visuals = Path('modules/ActionBarsVisuals.lua').read_text()
          facade = Path('modules/ActionBars.lua').read_text()
          check = Path('check_lua.js').read_text()

          required_state = [
              'State._holderRegistry',
              'local function EnsureScriptHook',
              'local function OnButtonStateEnter',
              'local function OnButtonAutoHideEdge',
              'local function OnHolderAutoHideEdge',
              'record.autoHideHooks = enterOK and leaveOK or false',
          ]
          for needle in required_state:
              assert needle in state, f'missing ActionBars hook contract: {needle}'

          for needle in (
              'holder._fguiAutoHidden',
              'holder._fguiAutoHideHooks',
              'module._autoHideHooksAttached = true',
          ):
              assert needle not in state, f'legacy ActionBars hook ownership remains: {needle}'

          assert 'local hooksOK, hooksDetail = module:EnsureAutoHideHooks()' in runtime
          assert 'local ok, detail = State.AttachButtonAutoHideHooks(button, module)' in runtime
          assert 'local ok, detail = Visuals.SkinButton(button, style)' in runtime
          assert visuals.count('if ok == false then return false, detail end') >= 2
          assert 'return State.EnsureAutoHideHooks(self)' in facade
          assert 'ActionBars holder hook metadata' in check
          assert not re.search(r'record\.autoHideHooks\s*=\s*true\s*\n\s*btn:HookScript', state)
          print('ActionBars hook ownership audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run ActionBars hook harness
        run: lua5.1 .codex/test_actionbars_hook_ownership.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-actionbars-hook-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make ActionBars hooks result-bearing" -m "Move holder auto-hide state and holder/button hook completion into weak registries, publish each edge only after HookScript succeeds, resolve current owners at dispatch, reuse partial state layers, and propagate initialization failures through visuals and runtime apply. Release FeelsGoodUI 0.0.66."
          git push origin HEAD:codex/actionbars-hook-ownership
