name: Apply mover transaction owner v2

on:
  push:
    branches:
      - codex/movers-transaction-owner-v2
    paths:
      - '.github/bootstrap/exact.patch.gz.b64.first*'
      - '.github/bootstrap/exact.patch.gz.b64.part02'
      - '.github/bootstrap/exact.patch.gz.b64.part03'
      - '.github/bootstrap/exact.patch.gz.b64.part04'
      - '.github/bootstrap/exact.patch.gz.b64.part05'
      - '.github/workflows/apply-movers-v2.yml'

permissions:
  contents: write

concurrency:
  group: movers-transaction-owner-v2
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/bootstrap/exact.patch.gz.b64.first01 \
            .github/bootstrap/exact.patch.gz.b64.first02 \
            .github/bootstrap/exact.patch.gz.b64.part02 \
            .github/bootstrap/exact.patch.gz.b64.part03 \
            .github/bootstrap/exact.patch.gz.b64.part04 \
            .github/bootstrap/exact.patch.gz.b64.part05 \
            | base64 --decode > /tmp/patch.gz
          echo '134bf44aa3e4387e7bcc6062422ca94318813fae4b3c7afb27b93de1c9217ec0  /tmp/patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/patch.gz > /tmp/feelsgood-ui-0.0.49.patch
          echo 'a36c32c0a5e6feac31c9f2895f5a5a5bcfc6a47a9835d77e45be89e16043899d  /tmp/feelsgood-ui-0.0.49.patch' | sha256sum --check --strict

      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/feelsgood-ui-0.0.49.patch
          git apply /tmp/feelsgood-ui-0.0.49.patch
          git diff --check

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check check_lua.js
          npm ci
          npm test

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/bootstrap
          rm -f .github/workflows/apply-movers-v2.yml
          rm -f .github/workflows/export-main-snapshot.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No implementation changes produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make mover geometry transactional'
          git push origin "HEAD:${GITHUB_REF_NAME}"
