name: Harden ActionBars callback records

on:
  push:
    branches:
      - codex/actionbars-global-hooks

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply callback-record refinement
        shell: bash
        run: |
          set -euo pipefail
          python .codex/refine_actionbars_callback_records.py
          python .codex/fix_actionbars_global_hook_dispatch.py
          python .codex/refine_actionbars_active_owner_fixtures.py
          python .codex/refine_actionbars_callback_record_fixture.py
          git diff --check

      - name: Audit callback generation lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('modules/ActionBarsRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          required = [
              'Runtime._callbackRecord = nil',
              'Runtime._nextCallbackID = 0',
              'local function DispatchActionChanged(record, _, button)',
              'record.active == true and Runtime._callbackRecord == record',
              'module._actionChangedCallbackRecord = record',
              'callbackRecord.active = false',
              'module._callbackHandles = nil',
          ]
          for needle in required:
              assert needle in runtime, f'missing callback record contract: {needle}'

          detach = runtime.split('function Runtime.Detach(module)', 1)[1].split('return Runtime', 1)[0]
          assert detach.index('callbackRecord.active = false') < detach.index('callbackHandles.Unregister')
          assert detach.index('Runtime._callbackRecord = nil') < detach.index('callbackHandles.Unregister')
          assert 'unguarded ActionBars callback registration' in check
          print('ActionBars callback generation audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run state secure-hook harness
        run: lua5.1 .codex/test_actionbars_global_state_hooks.lua

      - name: Run shell hook harness
        run: lua5.1 .codex/test_actionbars_shell_hooks.lua

      - name: Run callback generation harness
        run: lua5.1 .codex/test_actionbars_runtime_hook_lifecycle.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-actionbars-callback-records.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Invalidate stale ActionBars callbacks" -m "Wrap every action-change callback registration in an invalidatable record, deactivate it before detach cleanup, create fresh handle containers on retry, and prevent stale handles from becoming active after a failed unregister."
          git push origin HEAD:codex/actionbars-global-hooks
