name: Harden Companion runtime lifecycle

on:
  push:
    branches:
      - codex/companion-runtime-lifecycle

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Companion runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_companion_runtime_lifecycle.py
          python .codex/update_companion_runtime_docs.py
          python .codex/fix_companion_runtime_fixture.py
          git diff --check

      - name: Audit generation ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('modules/CompanionRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          required = [
              'Runtime._nextExpandRecordID',
              'module._expandCallbackRecord ~= record',
              'local function PrepareWatcherRecord(module, events, mode)',
              'module._watcherRecord ~= record or record.active ~= true',
              'callback unregister failed',
              'Companion restore deferred until combat ends',
              'local expandRecord, expandDetail = PrepareExpandRecord(module)',
              'local watcherRecord, watcherDetail = PrepareWatcherRecord',
              'module._pendingDetachRestore = true',
          ]
          for needle in required:
              assert needle in source, f'missing Companion runtime contract: {needle}'

          assert not re.search(r'module\._callbackHandles:Unregister\(\)', source)
          assert not re.search(r'\bwatcher:RegisterEvent\(', source)
          assert not re.search(r'\bwatcher:UnregisterAllEvents\(\)', source)
          assert 'Runtime._nextExpandRecordID' in check
          assert 'local function PrepareWatcherRecord(module, events, mode)' in check
          print('Companion runtime generation audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run Companion runtime harness
        run: lua5.1 .codex/test_companion_runtime_lifecycle.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-companion-runtime-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Companion runtime registrations generation-owned" -m "Prepare EventRegistry and watcher records before publication, invalidate exact generations before unregister, retain failed teardown for retry, finalize combat detach through a dedicated watcher, propagate layer and restore failures, and release FeelsGoodUI 0.0.72."
          git push origin HEAD:codex/companion-runtime-lifecycle
