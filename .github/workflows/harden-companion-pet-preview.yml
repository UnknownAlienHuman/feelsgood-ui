name: Harden Companion pet-bar preview journal

on:
  push:
    branches:
      - codex/companion-petbar-snapshots
    paths:
      - '.github/workflows/harden-companion-pet-preview.yml'
      - '.codex/fix_companion_pet_preview_fixture.py'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Journal mover preview
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_companion_pet_preview.py
          python .codex/fix_companion_pet_preview_fixture.py
          git diff --check

      - name: Audit preview ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pet = Path('modules/CompanionPetBar.lua').read_text()
          check = Path('check_lua.js').read_text()
          readme = Path('README.md').read_text()
          fixture = Path('.codex/test_companion_pet_preview.lua').read_text()

          preview = pet.split('PreviewPetLayout = function', 1)[1].split('local function RefreshBlizzardPetBar', 1)[0]
          required = [
              'local pending = {}',
              'PetState:BeginButton',
              'PetState:FinishButton',
              'PetState:ReleaseButton',
              'Managed pet action button preview capture failed',
          ]
          for needle in required:
              assert needle in preview, f'missing preview journal contract: {needle}'

          assert 'Managed pet action button preview capture failed' in check
          assert 'mover preview updates the same managed journal' in readme
          assert 'ClampButtonSize = function(_, value)' in fixture
          assert 'ClampSpacing = function(_, value)' in fixture
          print('Companion pet-bar preview ownership audit passed.')
          PY

      - name: Run Lua preview harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_companion_pet_preview.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-companion-pet-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Journal Companion pet-bar preview" -m "Route mover size and wheel preview through CompanionPetState Begin/Finish records so detach, cancel, rollback, and dynamic visibility changes restore exact structural state."
          git push origin HEAD:codex/companion-petbar-snapshots
