name: Finalize generic state registries

on:
  push:
    branches:
      - codex/generic-state-registries

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify generated release state
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .codex
          test ! -e .github/workflows/harden-generic-state-registries.yml
          grep -Fq '## Version: 0.0.61' FeelsGoodUI.toc
          grep -Fq 'Animate._frameRegistry' core/Animate.lua
          grep -Fq 'Animate._timerRegistry' core/Animate.lua
          grep -Fq 'local dragHookRegistry = setmetatable' core/MinimapIcon.lua
          grep -Fq 'local draggingButton = nil' core/MinimapIcon.lua
          ! grep -Eq '_fguiAnimate(State|Timers)|group\._fgui' core/Animate.lua
          ! grep -Fq '_fguiTransactionalDragHooked' core/MinimapIcon.lua
          ! grep -Fq 'function U.GetCooldownTimerText' core/Utils.lua
          git diff --check

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-generic-state-registries.yml
          git commit -m "Remove temporary generic registry gate"
          git push origin HEAD:codex/generic-state-registries

      - name: Ready and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head codex/generic-state-registries \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"
          test -n "$pr_number"
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --subject "Move generic runtime state into registries" \
            --body "Keep Animate fade/timer state and Minimap LibDBIcon hook state in weak-key addon registries, bind active drag to the exact button, and remove the dead arbitrary cooldown-frame cache helper. Release FeelsGoodUI 0.0.61."
