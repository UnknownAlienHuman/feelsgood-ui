name: Harden ActionBars global hooks

on:
  push:
    branches:
      - codex/actionbars-global-hooks

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply global-hook transform
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_actionbars_global_hooks.py
          git diff --check

      - name: Audit global hook lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          state = Path('modules/ActionBarsState.lua').read_text()
          shell = Path('modules/ActionBarsBlizzardShell.lua').read_text()
          runtime = Path('modules/ActionBarsRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          required = {
              'state secure registry': 'State._secureHookRegistry',
              'state owner release': 'State.ReleaseStateHookOwner',
              'shell secure registry': 'Shell._secureHookRegistry',
              'shell script registry': 'Shell._scriptHookRegistry',
              'shell owner release': 'Shell.ReleaseHookOwner',
              'callback registration guard': 'local registeredOK, registeredDetail = pcall',
              'init result propagation': 'local initOK, initDetail = Runtime.Init(module)',
              'detach state release': 'State.ReleaseStateHookOwner(module)',
              'detach shell release': 'Shell.ReleaseHookOwner(module)',
          }
          haystacks = {
              'state secure registry': state,
              'state owner release': state,
              'shell secure registry': shell,
              'shell script registry': shell,
              'shell owner release': shell,
              'callback registration guard': runtime,
              'init result propagation': runtime,
              'detach state release': runtime,
              'detach shell release': runtime,
          }
          for label, needle in required.items():
              assert needle in haystacks[label], f'missing {label}: {needle}'

          for needle in ('_stateHooksAttached',):
              assert needle not in state, f'legacy state summary remains: {needle}'
          for needle in ('_endCapsHooked', '_settingsPanelHooked', '_settingsTransitionHooked', '_settingsShellRepair'):
              assert needle not in shell, f'legacy shell hook metadata remains: {needle}'

          assert not re.search(
              r'_actionChangedCallbackRegistered\s*=\s*true\s*\n\s*module\._callbackHandles:RegisterCallback',
              runtime,
          )
          assert runtime.index('module._actionChangedCallbackRegistered = true') > runtime.index('local registeredOK, registeredDetail = pcall')
          init = runtime.split('function Runtime.Init(module)', 1)[1].split('function Runtime.Attach(module)', 1)[0]
          assert init.index('module._initDone = true') > init.index('local stateOK, stateDetail')
          assert init.index('module._initDone = true') > init.index('local endCapsOK, endCapsDetail')
          assert 'pre-published ActionBars initialization' in check
          print('ActionBars global hook lifecycle audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run state secure-hook harness
        run: lua5.1 .codex/test_actionbars_global_state_hooks.lua

      - name: Run shell hook harness
        run: lua5.1 .codex/test_actionbars_shell_hooks.lua

      - name: Run callback lifecycle harness
        run: lua5.1 .codex/test_actionbars_runtime_hook_lifecycle.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-actionbars-global-hooks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make ActionBars global hooks retryable" -m "Own secure, SettingsPanel, EndCaps, and action-change callback registration by target/method registries; publish init/callback state only after success, resolve current owners at dispatch, and release owners/handles on detach. Release FeelsGoodUI 0.0.67."
          git push origin HEAD:codex/actionbars-global-hooks
