name: Harden Companion pet-state ownership edges

on:
  push:
    branches:
      - codex/companion-petbar-snapshots
    paths:
      - '.github/workflows/harden-companion-pet-state-v2.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply ownership-edge hardening
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_companion_pet_state_v2.py
          git diff --check

      - name: Audit visibility and component ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          state = Path('modules/CompanionPetState.lua').read_text()
          check = Path('check_lua.js').read_text()
          readme = Path('README.md').read_text()

          required = [
              'ValidateCapturedComponents',
              'ComponentsMatch',
              'local structuralOwned = parentKnown',
              'if currentShown == managed.shown then',
              'or not ComponentsMatch(record.original, components)',
          ]
          for needle in required:
              assert needle in state, f'missing PetState edge contract: {needle}'

          assert 'ValidateCapturedComponents' in check
          assert 'ComponentsMatch' in check
          assert 'structural layout and dynamic visibility have separate ownership' in readme
          print('PetState visibility/component ownership audit passed.')
          PY

      - name: Run Lua ownership-edge harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_companion_pet_state_v2.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-companion-pet-state-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate PetBar structure from visibility ownership" -m "Restore parent/points/size independently from dynamic shown state, reopen snapshots when Blizzard component objects change, and refuse mutable components whose original state cannot be read exactly."
          git push origin HEAD:codex/companion-petbar-snapshots
