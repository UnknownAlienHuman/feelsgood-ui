name: Harden CenterBars native ownership

on:
  push:
    branches:
      - codex/centerbars-native-ownership
    paths:
      - '.github/workflows/harden-centerbars-native-ownership.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply native ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_centerbars_native_ownership.py
          git diff --check

      - name: Audit class-resource ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('modules/CenterBarsRender.lua').read_text()
          check = Path('check_lua.js').read_text()

          required = [
              'owner._classResourceSuppression',
              'EnsureClassResourceShowHook',
              'RestoreClassResourceRecord',
              'SuppressClassResourceFrame',
          ]
          for needle in required:
              assert needle in source, f'missing ownership contract: {needle}'

          forbidden = [
              'pcall(frame.Hide, frame)',
              'pcall(frame.Show, frame)',
              'pcall(frame.Setup, frame)',
              '_fguiSuppressRequested',
              '_fguiSuppressHooked',
          ]
          for needle in forbidden:
              assert needle not in source, f'foreign-frame takeover remains: {needle}'

          assert 'native class-resource Hide takeover' in check
          assert 'foreign class-resource ownership markers' in check
          print('CenterBars class-resource ownership audit passed.')
          PY

      - name: Run Lua ownership harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_centerbars_native_ownership.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-centerbars-native-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make CenterBars native takeover reversible" -m "Replace Hide/Show/Setup and foreign frame markers with owner-local alpha/mouse snapshots, gated OnShow hooks, frame-replacement handling, combat-deferred sync, and conflict-aware restore. Release FeelsGoodUI 0.0.56."
          git push origin HEAD:codex/centerbars-native-ownership
