name: Refine UnitFrames observer publication

on:
  push:
    branches:
      - codex/unitframes-observer-atomicity

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply publication refinement
        shell: bash
        run: |
          set -euo pipefail
          python .codex/refine_unitframes_observer_publication.py
          git diff --check

      - name: Audit publication contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('modules/UnitFramesTarget.lua').read_text()
          check = Path('check_lua.js').read_text()

          required = [
              'local function PublishTargetHeaderAnchorSignals(frame)',
              'UnitFrames observer frame unit is unavailable or unsupported',
              'MarkRetiredFrame(ownerRecord, failedFrame)',
              'PublishTargetHeaderAnchorSignals(frame)',
          ]
          for needle in required:
              assert needle in target, f'missing publication contract: {needle}'

          hook_section = target.split('local function HookTargetHeaderSignal(frame, element)', 1)[1].split('local function PublishTargetHeaderSignal', 1)[0]
          assert 'hook.frame = frame' not in hook_section
          assert 'PublishTargetHeaderAnchorSignals' in check
          print('UnitFrames observer publication audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run publication harness
        run: lua5.1 .codex/test_unitframes_observer_publication.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/refine-unitframes-observer-publication.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delay UnitFrames observer owner publication" -m "Publish reused header-container ownership only after the observer is fully prepared, reject malformed frame units, retain failed partial observers in owner cleanup state, and keep prior observers active across failed replacement."
          git push origin HEAD:codex/unitframes-observer-atomicity
