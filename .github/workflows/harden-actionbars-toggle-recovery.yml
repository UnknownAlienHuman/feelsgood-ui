name: Harden ActionBars toggle recovery

on:
  push:
    branches:
      - codex/actionbars-config-purity
    paths:
      - '.github/workflows/harden-actionbars-toggle-recovery.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Add durable toggle recovery
        shell: bash
        run: |
          set -euo pipefail
          python .codex/add_actionbars_toggle_recovery.py
          git diff --check

      - name: Audit recovery ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          shell = Path('modules/ActionBarsBlizzardShell.lua').read_text()
          check = Path('check_lua.js').read_text()
          readme = Path('README.md').read_text()

          required = [
              'NATIVE_TOGGLE_RECOVERY_KEY',
              'GetNativeToggleRecoveryID',
              'ReadPersistedNativeActionBarToggles',
              'PersistNativeActionBarToggles',
              'ClearPersistedNativeActionBarToggles',
          ]
          for needle in required:
              assert needle in shell, f'missing durable toggle owner: {needle}'
          assert 'NATIVE_TOGGLE_RECOVERY_KEY' in check
          assert 'per-character recovery marker' in readme
          print('ActionBars durable recovery ownership audit passed.')
          PY

      - name: Run durable recovery harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_actionbars_toggle_recovery.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-actionbars-toggle-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist ActionBars native toggle baseline" -m "Keep the pre-takeover native toggle vector in a compact per-character recovery record so reload or interruption cannot lose the baseline; clear it only after exact restore."
          git push origin HEAD:codex/actionbars-config-purity
