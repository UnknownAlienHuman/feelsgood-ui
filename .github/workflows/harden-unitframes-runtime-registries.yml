name: Harden UnitFrames runtime registries

on:
  push:
    branches:
      - codex/unitframes-runtime-registries
    paths:
      - '.github/workflows/harden-unitframes-runtime-registries.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified transform and harness
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .codex/ufreg.transform.py.gz.b64 | gzip --decompress > /tmp/harden_unitframes_runtime_registries.py
          base64 --decode .codex/ufreg.harness.lua.gz.b64 | gzip --decompress > /tmp/test_unitframes_runtime_registries.lua
          echo "0a6696eff88733b6403fcbc7f0f2ab89a20716b4fa83c87fb5c6eccc82c4c247  /tmp/harden_unitframes_runtime_registries.py" | sha256sum --check -
          echo "8f7e7a0188308a4b5c61dab9f7327fdae98a44a8fb84b5bb990cdccf30c824aa  /tmp/test_unitframes_runtime_registries.lua" | sha256sum --check -

      - name: Apply registry transform
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/harden_unitframes_runtime_registries.py
          git diff --check

      - name: Audit UnitFrames ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('modules/UnitFramesTarget.lua').read_text()
          render = Path('modules/UnitFramesRender.lua').read_text()
          runtime = Path('modules/UnitFramesRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          for needle in (
              'Target._frameRegistry',
              'Target._ownerRegistry',
              'Target._auraRoleRegistry',
              'Target._headerHookRegistry',
          ):
              assert needle in target, needle
          assert 'Render._lowHPRegistry' in render
          assert 'Runtime._unitWatchRegistry' in runtime
          assert '_fgui' not in target
          assert '_fguiLowHP' not in render
          assert '_fguiUnitWatch' not in runtime
          assert 'unitframesCfg.targetAuras =' not in target
          assert 'targetAuras.mode =' not in target
          assert 'oUF target observer or aura metadata' in check
          print('UnitFrames runtime ownership audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run UnitFrames registry harness
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 /tmp/test_unitframes_runtime_registries.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-unitframes-runtime-registries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move UnitFrames runtime state into registries" -m "Keep target observer/aura/header state, low-health cache and unit-watch ownership in addon weak registries, remove runtime aura-profile repair, and propagate native watch failures. Release FeelsGoodUI 0.0.62."
          git push origin HEAD:codex/unitframes-runtime-registries
