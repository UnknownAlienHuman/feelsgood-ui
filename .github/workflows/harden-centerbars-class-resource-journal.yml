name: Harden CenterBars class-resource journal

on:
  push:
    branches:
      - codex/lifecycle-ownership-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply CenterBars journal hardening
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_centerbars_class_resource_journal.py
          git diff --check

      - name: Audit native ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          render = Path('modules/CenterBarsRender.lua').read_text()
          runtime = Path('modules/CenterBarsRuntime.lua').read_text()
          registry = Path('core/FeatureRegistry.lua').read_text()
          check = Path('check_lua.js').read_text()

          render_required = [
              'SetAlpha did not retain the requested value',
              'EnableMouse did not retain the requested value',
              'record.alphaOwned = true',
              'record.mouseOwned = true',
              'previous frame restore failed',
              'record.releasing = true',
              'owner._classResourceSuppression = nil',
              'return SyncAndReportClassResources(owner)',
          ]
          for needle in render_required:
              assert needle in render, f'missing CenterBars render contract: {needle}'

          runtime_required = [
              'local function CallResult(name, ...)',
              'CenterBars native restore failed',
              'CenterBars initialization failed',
              'local refreshed, refreshDetail = RefreshResourceOwner(owner)',
          ]
          for needle in runtime_required:
              assert needle in runtime, f'missing CenterBars runtime contract: {needle}'

          assert 'center = { feature = "center", deferInCombat = true }' in registry
          assert 'SetAlpha did not retain the requested value' in check
          assert 'EnableMouse did not retain the requested value' in check
          assert 'local function ReadNativeFrameAlpha(frame)\n    if not' in render
          assert 'SetNativeFrameAlpha(frame, 0)\n        applied = true' not in render
          print('CenterBars native ownership audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run CenterBars journal harness
        run: lua5.1 .codex/test_centerbars_class_resource_journal.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-centerbars-class-resource-journal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify CenterBars native property ownership" -m "Capture alpha and mouse channels independently, verify every suppression and restore by readback, retain unresolved ownership for retry, block frame replacement until release, propagate exact failures, and centrally defer combat-sensitive CenterBars apply. Release FeelsGoodUI 0.0.69."
          git push origin HEAD:codex/lifecycle-ownership-hardening
