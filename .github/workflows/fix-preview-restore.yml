name: Fix mover preview restore

on:
  push:
    branches:
      - codex/movers-transaction-owner-v2
    paths:
      - '.github/workflows/fix-preview-restore.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harden preview failure recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('core/MoversTransactions.lua')
          source = path.read_text()

          old = (
              '        if not ok then\n'
              '            return false, first\n'
              '        end\n'
              '        if first == false then\n'
              '            return false, second or ("Mover " .. operation .. " preview returned false")\n'
              '        end\n'
          )
          new = (
              '        if not ok then\n'
              '            RestorePreview(spec.applyKeys)\n'
              '            return false, first\n'
              '        end\n'
              '        if first == false then\n'
              '            RestorePreview(spec.applyKeys)\n'
              '            return false, second or ("Mover " .. operation .. " preview returned false")\n'
              '        end\n'
          )
          if old not in source:
              raise SystemExit('preview failure block not found')
          source = source.replace(old, new, 1)

          old = (
              '    if not okSnapshots then\n'
              '        RestorePreview(applyKeys)\n'
              '        LogError("Mover transaction snapshot failed: " .. tostring(writeSnapshots))\n'
              '        return false, writeSnapshots\n'
              '    end\n'
          )
          new = (
              '    if not okSnapshots or type(writeSnapshots) ~= "table" then\n'
              '        local detail = okSnapshots and "Mover transaction snapshot unavailable" or writeSnapshots\n'
              '        RestorePreview(applyKeys)\n'
              '        LogError("Mover transaction snapshot failed: " .. tostring(detail))\n'
              '        return false, detail\n'
              '    end\n'
          )
          if old not in source:
              raise SystemExit('snapshot failure block not found')
          path.write_text(source.replace(old, new, 1))

          checker = Path('check_lua.js')
          source = checker.read_text()
          marker = "    assertSourceIncludes('core/MoversTransactions.lua', 'CaptureWriteSnapshots');\n"
          addition = marker + "    assertSourceIncludes('core/MoversTransactions.lua', 'RestorePreview(spec.applyKeys)');\n"
          if marker not in source:
              raise SystemExit('checker insertion point not found')
          checker.write_text(source.replace(marker, addition, 1))
          PY
          git diff --check

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          grep -F 'RestorePreview(spec.applyKeys)' core/MoversTransactions.lua

      - name: Commit code fix
        shell: bash
        run: |
          set -euo pipefail
          git add core/MoversTransactions.lua check_lua.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore failed mover previews'
          git push origin "HEAD:${GITHUB_REF_NAME}"
