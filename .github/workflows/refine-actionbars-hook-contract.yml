name: Refine ActionBars hook contract

on:
  push:
    branches:
      - codex/actionbars-hook-ownership

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply contract refinement
        shell: bash
        run: |
          set -euo pipefail
          python .codex/refine_actionbars_hook_contract.py
          python .codex/refine_actionbars_hook_fixture.py
          git diff --check

      - name: Audit detail and reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          state = Path('modules/ActionBarsState.lua').read_text()
          runtime = Path('modules/ActionBarsRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          assert 'local readyField = name .. "Ready"' in state
          assert 'record.slotBackgroundReady == true' in state
          assert 'return false, "ActionButton is not managed"' in state
          assert 'if skinOK and Visuals and Visuals.RefreshButtonVisualState' in runtime
          assert 'local ok, detail = Runtime.ApplyNow(module)' in runtime
          assert 'return ok, detail' in runtime
          assert 'ActionBar " .. tostring(id)' in runtime
          assert 'ActionButton3' not in runtime
          assert 'local readyField = name .. "Ready"' in check
          print('ActionBars detail/reuse audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run state hook harness
        run: lua5.1 .codex/test_actionbars_hook_ownership.lua

      - name: Run apply detail harness
        run: lua5.1 .codex/test_actionbars_apply_detail.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/refine-actionbars-hook-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve ActionBars hook diagnostics" -m "Carry exact bar/button hook failures through ApplyConfig, avoid repeating visual initialization after a failed skin pass, and keep active highlight/pressed layers intact across ordinary refreshes."
          git push origin HEAD:codex/actionbars-hook-ownership
