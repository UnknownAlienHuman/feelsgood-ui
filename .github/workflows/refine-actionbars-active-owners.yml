name: Refine ActionBars active owners

on:
  push:
    branches:
      - codex/actionbars-global-hooks

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply active-owner refinement
        shell: bash
        run: |
          set -euo pipefail
          python .codex/refine_actionbars_active_owner.py
          python .codex/refine_actionbars_active_owner_fixtures.py
          git diff --check

      - name: Audit owner publication order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          state = Path('modules/ActionBarsState.lua').read_text()
          shell = Path('modules/ActionBarsBlizzardShell.lua').read_text()
          runtime = Path('modules/ActionBarsRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          assert 'function State.SetStateHookOwner(module)' in state
          assert 'function Shell.SetHookOwner(module)' in shell
          state_ensure = state.split('function State.EnsureStateHooks(module, hasActionChangedCallback)', 1)[1].split('function State.RefreshEmptySlots(module)', 1)[0]
          shell_endcaps = shell.split('function Shell.EnsureEndCapsHook(module)', 1)[1].split('function Shell.EnsureSettingsHooks(module)', 1)[0]
          shell_settings = shell.split('function Shell.EnsureSettingsHooks(module)', 1)[1].split('return Shell', 1)[0]
          assert 'GlobalHookState.owner = module' not in state_ensure
          assert 'GlobalHookState.owner = module' not in shell_endcaps
          assert 'GlobalHookState.owner = module' not in shell_settings

          assert 'Runtime._callbackOwner = nil' in runtime
          assert 'local activeModule = Runtime._callbackOwner' in runtime
          init = runtime.split('function Runtime.Init(module)', 1)[1].split('function Runtime.Attach(module)', 1)[0]
          assert init.index('State.SetStateHookOwner(module)') > init.index('local endCapsOK, endCapsDetail')
          assert init.index('Shell.SetHookOwner(module)') > init.index('local endCapsOK, endCapsDetail')
          assert init.index('Runtime._callbackOwner = callbackRegistered == true and module or nil') > init.index('Shell.SetHookOwner(module)')
          assert 'pre-success ActionBars state owner publication' in check
          assert 'pre-success ActionBars shell owner publication' in check
          print('ActionBars active-owner publication audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run state secure-hook harness
        run: lua5.1 .codex/test_actionbars_global_state_hooks.lua

      - name: Run shell hook harness
        run: lua5.1 .codex/test_actionbars_shell_hooks.lua

      - name: Run callback lifecycle harness
        run: lua5.1 .codex/test_actionbars_runtime_hook_lifecycle.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/refine-actionbars-active-owners.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delay ActionBars owner publication" -m "Keep partially installed permanent hooks and registered callbacks inert until callback, state, and shell initialization all succeed; publish active owners atomically and clear them during detach."
          git push origin HEAD:codex/actionbars-global-hooks
