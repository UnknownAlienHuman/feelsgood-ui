name: Export runtime purity base

on:
  push:
    branches:
      - codex/runtime-config-readonly
    paths:
      - '.github/workflows/export-runtime-base.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Archive current main
        run: |
          git archive --format=zip --output=/tmp/feelsgood-ui-main-0.0.49.zip origin/main
          sha256sum /tmp/feelsgood-ui-main-0.0.49.zip > /tmp/feelsgood-ui-main-0.0.49.sha256

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: feelsgood-ui-main-0.0.49
          path: |
            /tmp/feelsgood-ui-main-0.0.49.zip
            /tmp/feelsgood-ui-main-0.0.49.sha256
          retention-days: 1
