name: Harden generic state registries

on:
  push:
    branches:
      - codex/generic-state-registries
    paths:
      - '.github/workflows/harden-generic-state-registries.yml'
      - '.codex/run_harden_generic_state_registries.py'
      - '.codex/fix_generic_state_registry_fixtures.py'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply registry transform
        shell: bash
        run: |
          set -euo pipefail
          python .codex/run_harden_generic_state_registries.py
          python .codex/fix_generic_state_registry_fixtures.py
          git diff --check

      - name: Audit generic ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          animate = Path('core/Animate.lua').read_text()
          minimap = Path('core/MinimapIcon.lua').read_text()
          utils = Path('core/Utils.lua').read_text()
          check = Path('check_lua.js').read_text()
          fixture = Path('.codex/test_animate_registries.lua').read_text()

          required_animate = [
              'Animate._frameRegistry',
              'Animate._timerRegistry',
              'FrameRegistry[frame]',
              'TimerRegistry[host]',
              'state[key .. "FinalAlpha"]',
              'state[key .. "HideOnFinished"]',
              'local state = GetFrameState(frame, true)',
              'local state = GetFrameState(frame, false)',
          ]
          for needle in required_animate:
              assert needle in animate, f'missing Animate registry contract: {needle}'

          forbidden_animate = [
              '_fguiAnimateState',
              '_fguiAnimateTimers',
              'group._fguiFinalAlpha',
              'group._fguiHideOnFinished',
          ]
          for needle in forbidden_animate:
              assert needle not in animate, f'generic animation metadata remains: {needle}'

          required_minimap = [
              'local dragHookRegistry = setmetatable',
              'MinimapIcon._dragHookRegistry = dragHookRegistry',
              'local draggingButton = nil',
              'if draggingButton ~= stoppedButton then return end',
              'local activeButton = draggingButton',
          ]
          for needle in required_minimap:
              assert needle in minimap, f'missing minimap hook contract: {needle}'

          assert '_fguiTransactionalDragHooked' not in minimap
          assert 'local dragging = false' not in minimap
          assert 'function U.GetCooldownTimerText' not in utils
          assert 'generic animation owner metadata' in check
          assert 'LibDBIcon button metadata' in check
          assert 'Animate.CancelFade(frame, 0.55)' in fixture
          assert 'zero-delay callback token cancelled' in fixture
          print('Generic state ownership audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run Animate registry harness
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 .codex/test_animate_registries.lua

      - name: Run Minimap hook registry harness
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 .codex/test_minimap_hook_registry.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-generic-state-registries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move generic runtime state into registries" -m "Keep Animate fade/timer state and Minimap LibDBIcon hook state in weak-key addon registries, bind active drag to the exact button, and remove the dead arbitrary cooldown-frame cache helper. Release FeelsGoodUI 0.0.61."
          git push origin HEAD:codex/generic-state-registries
