name: Export main snapshot

on:
  push:
    branches:
      - codex/movers-transaction-owner-v2
    paths:
      - '.github/workflows/export-main-snapshot.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/feelsgood-ui-main.zip origin/main
          sha256sum /tmp/feelsgood-ui-main.zip | tee /tmp/feelsgood-ui-main.sha256

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: feelsgood-ui-main-snapshot
          path: |
            /tmp/feelsgood-ui-main.zip
            /tmp/feelsgood-ui-main.sha256
          if-no-files-found: error
          retention-days: 1
