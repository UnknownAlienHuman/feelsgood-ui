name: Harden Companion pet-button pending state

on:
  push:
    branches:
      - codex/companion-owner-state
    paths:
      - '.github/workflows/harden-companion-pet-pending.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply pending-state hardening
        shell: bash
        run: |
          set -euo pipefail
          python .codex/harden_companion_pet_pending.py
          git diff --check

      - name: Audit transient pet-button policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pet = Path('modules/CompanionPetBar.lua').read_text()
          runtime = Path('modules/CompanionRuntime.lua').read_text()
          micro = Path('modules/CompanionMicroBags.lua').read_text()
          check = Path('check_lua.js').read_text()

          assert 'return true, "Pet action buttons pending runtime creation"' in pet
          assert 'return false, "Pet action buttons unavailable"' not in pet
          assert 'module._pendingPetButtons = true' in pet
          assert 'module._pendingPetButtons = nil' in pet
          assert 'module._pendingPetButtons = nil' in runtime
          assert 'module._compactBagSummary = nil' in micro
          assert 'fatal transient pet-button startup' in check
          print('Companion transient pet-button audit passed.')
          PY

      - name: Run Lua pending-state harness
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi
          lua5.1 .codex/test_companion_pet_pending.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-companion-pet-pending.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Queue transient Companion pet buttons" -m "Treat missing PetActionButton frames during startup as queued event-driven work rather than a fatal lifecycle failure, clear pending markers after terminal success, and clear stale compact-bag summaries."
          git push origin HEAD:codex/companion-owner-state
