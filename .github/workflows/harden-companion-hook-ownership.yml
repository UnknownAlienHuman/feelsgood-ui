name: Harden Companion permanent hooks

on:
  push:
    branches:
      - codex/companion-hook-ownership
    paths:
      - '.github/workflows/harden-companion-hook-ownership.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified transform and harness
        shell: bash
        run: |
          set -euo pipefail
          cat <<'SUMS' | sha256sum --check -
          388525d7704f5b89cd1ef8b5b204090f6149f880265626701272251670692e28  .codex/parts/companion.transform.part00.b64
          1b239e712620c35004ed44f8ac7d5afd3ec3a9e553ec4a3dd54b8a84fceb1eca  .codex/parts/companion.transform.part01.b64
          86c6be68c78f42d266367000f754a4a230e3eee2e9a7b4d9d6b17dbb346a4cc0  .codex/parts/companion.transform.part02.b64
          7d0886388f027dc9a856b3d625cd7148642885f6218a50540c0391c4e3ffb905  .codex/parts/companion.transform.part03.b64
          db26f2a767f2d8bb3ffafd28669d7b2e758f86485b95f23aa28101c06dd4c7d6  .codex/parts/companion.transform.part04.b64
          f2de98fc1aef954457c0ad7b3513d773bf19fd76f7ca949c8370b3cf4a939ecc  .codex/parts/companion.transform.part05.b64
          ae73aa39f9aa8b89dfe2082cabe46ce4d0f483b3d2465daf803b1ddfaa7fc6b8  .codex/parts/companion.transform.part06.b64
          efd5bf32865ac7360b738e9fd45470d347a4090cac3911f7bce17c5570a5235f  .codex/parts/companion.harness.part00.b64
          d9a87e26069889843d8fe8ebab823620a08e48971905fcc85cc2c2aa0d14625a  .codex/parts/companion.harness.part01.b64
          e3d4ba0fd8c25bbb7721d69d0f3a33540793f201956615287bcf9c4348a1a544  .codex/parts/companion.harness.part02.b64
          d4b3cd7000f00c001488dbb201d0991ec9ee8551c6aca830f52298a2dcdee51f  .codex/parts/companion.harness.part03.b64
          017ebec85cb1a88497a18d4f00ab129fe789eae831cb59c0477b5a6502442803  .codex/parts/companion.harness.part04.b64
          SUMS

          cat .codex/parts/companion.transform.part*.b64 > /tmp/companion.transform.gz.b64
          cat .codex/parts/companion.harness.part*.b64 > /tmp/companion.harness.gz.b64
          echo "af4beecf3534c81306bc50ce7b3783d3dc057ba6182abb0b4b00088712b76bd8  /tmp/companion.transform.gz.b64" | sha256sum --check -
          echo "98475564da6c428ec7a0a0f4553a213630c4fa088a9b8551e0a1663f9939fdec  /tmp/companion.harness.gz.b64" | sha256sum --check -

          base64 --decode /tmp/companion.transform.gz.b64 | gzip --decompress > /tmp/harden_companion_hook_ownership.py
          base64 --decode /tmp/companion.harness.gz.b64 | gzip --decompress > /tmp/test_companion_hook_ownership.lua
          echo "dbec99bfe13790b139c4912b90698387aa8fbb7fdae7710dfb2c257da9f27ce9  /tmp/harden_companion_hook_ownership.py" | sha256sum --check -
          echo "c0330687e8d71fbf0c5016860badced33fd1dd28274064c5ac072a4460be8180  /tmp/test_companion_hook_ownership.lua" | sha256sum --check -

      - name: Apply verified ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/harden_companion_hook_ownership.py
          git diff --check

      - name: Audit permanent-hook ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          micro = Path('modules/CompanionMicroBags.lua').read_text()
          runtime = Path('modules/CompanionRuntime.lua').read_text()
          check = Path('check_lua.js').read_text()

          required_micro = [
              'GetWeakHookRegistry',
              'RunPermanentHook',
              'ReconcileMicroResetHook',
              'ReconcileBagTextureHooks',
              'StyleBackpackButton(button, size, skipTextureRefresh)',
              'StyleBackpackButton(button, cp.buttonSize or 32, true)',
          ]
          for needle in required_micro:
              assert needle in micro, f'missing Companion hook contract: {needle}'

          required_runtime = [
              'Companion callback container creation failed',
              'Companion callback registration failed',
              'Companion expand callback failed',
              'local callbackReady, callbackDetail = EnsureExpandChangedCallback(module)',
          ]
          for needle in required_runtime:
              assert needle in runtime, f'missing Companion callback contract: {needle}'

          forbidden = [
              'module._microResetHooked',
              'hooks[obj] = true',
              'module._bagTextureHooks[bagButton] = true',
          ]
          for needle in forbidden:
              assert needle not in micro, f'preemptive hook publication remains: {needle}'

          assert 'Companion source object marked hooked before HookScript succeeds' in check
          assert 'recursive UpdateTextures call from its own secure hook' in check
          print('Companion permanent-hook ownership audit passed.')
          PY

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y lua5.1
          fi

      - name: Run permanent-hook harness
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p /tmp/test_companion_hook_ownership.lua
          lua5.1 /tmp/test_companion_hook_ownership.lua

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex
          rm -f .github/workflows/harden-companion-hook-ownership.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Companion permanent hooks retryable" -m "Publish hook ownership only after successful registration, reconcile replacement Blizzard objects through weak-key records, make stale callbacks inert, prevent backpack UpdateTextures recursion, and propagate expand callback registration failures. Release FeelsGoodUI 0.0.64."
          git push origin HEAD:codex/companion-hook-ownership
